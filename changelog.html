<style>
  :root {
    --bg: #08070a;
    --bg-alt: #0f0c12;
    --text: #f7f2f5;
    --text-dim: rgba(247,242,245,.82);
    --text-dimmer: rgba(247,242,245,.55);
    --line: rgba(247,242,245,.14);
    --pink: #ff2e88;
    --cyan: #7df9ff;
    --soft: #f8c8dc;
    --header-h: 73px;
    --added: #2f9e4a;
    --changed: #e0a800;
    --removed: #d64545;
    --renamed: #8a8a94;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  * { scrollbar-width: thin; scrollbar-color: rgba(255,46,136,.4) var(--bg); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(255,46,136,.4); border-radius: 999px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--pink); }
  ::selection { background: var(--pink); color: var(--bg); }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 5vw; }
  .display { font-family: 'Anton', sans-serif; text-transform: uppercase; }
  .mono { font-family: 'Space Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }

  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.12); opacity: 1; } }

  header {
    position: sticky; top: 0; z-index: 40; height: var(--header-h);
    background: rgba(8,7,10,.76); backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,46,136,.35);
  }
  header .wrap { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; padding-bottom: 14px; gap: 16px; max-width: 1400px; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: .04em; }
  .logo::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pink);
    box-shadow: 0 0 16px var(--pink); animation: pulse 2s ease-in-out infinite;
  }
  nav { display: flex; align-items: center; gap: clamp(10px,2vw,28px); font-size: 12px; color: var(--text); }
  nav a { position: relative; transition: color .2s ease; }
  nav a:hover { color: var(--pink); }
  nav a.nav-cta { background: var(--pink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 700; }
  nav a.nav-cta:hover { color: var(--bg); opacity: .85; }
  @media (max-width: 640px) { nav a:not(.nav-cta) { display: none; } }

  .cl-hero { position: relative; padding: clamp(48px,8vw,90px) 0 clamp(30px,5vw,50px); overflow: hidden; }
  .cl-glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(50% 60% at 15% 10%, rgba(125,249,255,.14), transparent 70%),
                radial-gradient(40% 50% at 90% 40%, rgba(255,46,136,.1), transparent 70%);
  }
  .kicker { font-size: 12px; letter-spacing: .24em; color: var(--cyan); margin-bottom: 14px; position: relative; z-index: 1; }
  .cl-h1 { font-size: clamp(34px,6vw,68px); line-height: .98; margin: 0 0 16px; position: relative; z-index: 1; }
  .cl-h1 .accent-word { color: var(--pink); }
  .cl-lead { max-width: 62ch; font-size: clamp(15px,1.4vw,17px); line-height: 1.7; color: var(--text-dim); position: relative; z-index: 1; margin: 0; }

  .cl-stats { display: flex; flex-wrap: wrap; gap: clamp(20px,4vw,44px); margin-top: 30px; position: relative; z-index: 1; }
  .cl-stat-num { font-family: 'Anton',sans-serif; font-size: clamp(28px,3.4vw,40px); color: var(--pink); line-height: 1; }
  .cl-stat-label { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dimmer); margin-top: 4px; }

  .cl-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; position: relative; z-index: 1; }
  .cl-legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .06em; color: var(--text-dimmer); border: 1px solid var(--line); padding: 5px 11px; border-radius: 999px; }
  .cl-legend-dot { width: 8px; height: 8px; border-radius: 999px; flex: 0 0 auto; }

  .timeline { padding: clamp(30px,5vw,60px) 0 clamp(60px,8vw,100px); }

  .cl-day { position: relative; padding-left: 30px; margin-bottom: clamp(34px,5vw,54px); border-left: 2px solid var(--line); }
  .cl-day:last-child { border-left-color: transparent; }
  .cl-day-banner {
    position: relative; margin-left: -30px; margin-bottom: 18px;
    background: linear-gradient(90deg, var(--bg-alt), rgba(15,12,18,0));
    border-left: 2px solid var(--pink);
    padding: 10px 0 10px 28px;
  }
  .cl-day-banner::before {
    content: ""; position: absolute; left: -9px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 999px; background: var(--bg);
    border: 2px solid var(--pink); box-shadow: 0 0 12px rgba(255,46,136,.5);
  }
  .cl-day-date { font-size: clamp(19px,2.2vw,26px); margin: 0; }
  .cl-day-title { font-size: 13px; color: var(--text-dimmer); margin-top: 3px; }
  .cl-day-count { font-size: 10.5px; color: var(--cyan); letter-spacing: .1em; margin-top: 3px; }

  .cl-items { display: flex; flex-direction: column; gap: 10px; }
  .cl-item {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--bg-alt); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px;
  }
  .cl-item.milestone { border-color: var(--lab-color, var(--pink)); background: linear-gradient(90deg, rgba(255,46,136,.05), var(--bg-alt) 40%); }
  .cl-tags { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; min-width: 128px; }
  .cl-lab-tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700;
    color: var(--lab-color); white-space: nowrap;
  }
  .cl-lab-tag .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--lab-color); box-shadow: 0 0 8px var(--lab-color); flex: 0 0 auto; }
  .cl-type-badge {
    display: inline-flex; align-items: center; font-family: 'Space Mono',monospace; font-size: 9.5px;
    letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
    background: var(--type-soft); color: var(--type-color); border: 1px solid var(--type-color);
    width: fit-content;
  }
  .cl-text { font-size: 14px; line-height: 1.6; color: var(--text-dim); flex: 1 1 auto; }
  .cl-text b { color: var(--text); }

  .cl-footer { padding: 24px 0; border-top: 1px solid var(--line); font-size: 11px; letter-spacing: .1em; color: var(--text-dimmer); text-align: center; }

  @media (max-width: 640px) {
    .cl-item { flex-direction: column; }
    .cl-tags { flex-direction: row; min-width: 0; flex-wrap: wrap; }
    .cl-day { padding-left: 20px; }
    .cl-day-banner { margin-left: -20px; padding-left: 18px; }
  }
</style>

// ── рендер ───────────────────────────────────────────────────────────────
var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function formatDay(iso) {
  var p = iso.split('-');
  return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1];
}

function renderStats() {
  var totalCommits = DAYS.reduce(function (s, d) { return s + d.items.length; }, 0);
  var labKeys = {};
  DAYS.forEach(function (d) { d.items.forEach(function (it) { labKeys[it.lab] = true; }); });
  var repoCount = Object.keys(labKeys).length - 1; // минус 'site'
  var stats = [
    { num: totalCommits, label: 'событий в хронологии' },
    { num: repoCount, label: 'лаб в работе' },
    { num: DAYS.length, label: 'дней с изменениями' },
  ];
  document.getElementById('cl-stats').innerHTML = stats.map(function (s) {
    return '<div><div class="cl-stat-num display">' + s.num + '</div><div class="cl-stat-label mono">' + s.label + '</div></div>';
  }).join('');

  document.getElementById('cl-legend').innerHTML = Object.keys(TYPES).map(function (k) {
    return '<span class="cl-legend-item"><span class="cl-legend-dot" style="background:' + TYPES[k].color + '"></span>' + TYPES[k].label + '</span>';
  }).join('');
}

function renderTimeline() {
  document.getElementById('timeline').innerHTML = DAYS.map(function (day) {
    var itemsHtml = day.items.map(function (it) {
      var lab = LABS[it.lab] || { label: it.lab, color: '#999' };
      var type = TYPES[it.type] || TYPES.changed;
      return (
        '<div class="cl-item' + (it.milestone ? ' milestone' : '') + '" style="--lab-color:' + lab.color + '">' +
          '<div class="cl-tags">' +
            '<span class="cl-lab-tag" style="--lab-color:' + lab.color + '"><span class="dot"></span>' + lab.label + '</span>' +
            '<span class="cl-type-badge" style="--type-color:' + type.color + '; --type-soft:rgba(255,255,255,.05)">' + type.label + '</span>' +
          '</div>' +
          '<div class="cl-text">' + it.text + '</div>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="cl-day">' +
        '<div class="cl-day-banner">' +
          '<h2 class="cl-day-date display">' + formatDay(day.date) + '</h2>' +
          '<div class="cl-day-title">' + day.title + '</div>' +
          '<div class="cl-day-count mono">' + day.items.length + (day.items.length === 1 ? ' событие' : (day.items.length < 5 ? ' события' : ' событий')) + '</div>' +
        '</div>' +
        '<div class="cl-items">' + itemsHtml + '</div>' +
      '</div>'
    );
  }).join('');
}

renderStats();
renderTimeline();
document.getElementById('cl-generated').textContent = 'по состоянию на ' + formatDay('2026-09-23') + ' 2026';
</script>
